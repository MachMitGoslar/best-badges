# Testumgebung Best Badges auf stuffdev – Ordner /srv/stacks/badges (Compose-Projekt best-badges).
# Images baut deploy.sh auf dem Mac und lädt sie hoch (der Server hat zu wenig freien Speicher zum Bauen).
# Geheimnisse in ./.env (trägt stuff ein).
#
# Öffentlich:  https://badges.stuffdev.de      Verwaltung (BFF + Oberfläche)
#              https://badges-api.stuffdev.de  API für die App, öffentliche Doku unter /docs
# Anmeldung:   Authentik (auth.stuffdev.de), Anwendung „best-badges“, nur Gruppe badges-testers
# Daten:       Datenbank best_badges im vorhandenen postgres-Container (nächtliches pg_dumpall sichert sie mit)
name: best-badges

x-common: &common
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  tmpfs: [/tmp]
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "3" }

services:
  api:
    <<: *common
    image: best-badges-api:${BADGES_TAG:-latest}
    mem_limit: 256m
    container_name: best-badges-api
    networks: [rag, internal]
    environment:
      - DATABASE_URL=postgres://best_badges:${BADGES_DB_PASSWORD:?BADGES_DB_PASSWORD fehlt}@postgres:5432/best_badges
      - OIDC_ISSUER=https://auth.stuffdev.de/application/o/best-badges/
      - OIDC_AUDIENCE=best-badges
      - HSP_BASE_URL=http://mock-hsp:4010/api
      - ADMIN_ORG_ID=00000000-0000-4000-8000-000000000001
      - PUBLIC_BASE_URL=https://badges-api.stuffdev.de
      # Die App ruft nativ auf (kein CORS nötig), die Verwaltung über ihren eigenen Server
      - CORS_ORIGINS=
      - INTERNAL_DOCS=false
      - TZ=Europe/Berlin
    depends_on:
      mock-hsp: { condition: service_started }
    labels:
      - traefik.enable=true
      - traefik.docker.network=rag-stack_rag
      - traefik.http.routers.badges-api.rule=Host(`badges-api.stuffdev.de`)
      - traefik.http.routers.badges-api.entrypoints=websecure
      - traefik.http.routers.badges-api.tls=true
      - traefik.http.routers.badges-api.tls.certresolver=le
      - traefik.http.routers.badges-api.middlewares=secure-headers@file,badges-ratelimit,badges-noindex
      - traefik.http.services.badges-api.loadbalancer.server.port=3001
      # Pro Client-IP; die API begrenzt zusätzlich je Person (Einlösen) und je API-Schlüssel
      - traefik.http.middlewares.badges-ratelimit.ratelimit.average=20
      - traefik.http.middlewares.badges-ratelimit.ratelimit.period=1s
      - traefik.http.middlewares.badges-ratelimit.ratelimit.burst=60
      # Testumgebung nicht in Suchmaschinen
      - traefik.http.middlewares.badges-noindex.headers.customresponseheaders.X-Robots-Tag=noindex, nofollow

  manage:
    <<: *common
    image: best-badges-manage:${BADGES_TAG:-latest}
    mem_limit: 160m
    container_name: best-badges-manage
    networks: [rag, internal]
    environment:
      - MANAGE_PUBLIC_URL=https://badges.stuffdev.de
      - OIDC_ISSUER=https://auth.stuffdev.de/application/o/best-badges/
      - OIDC_AUDIENCE=best-badges
      - MANAGE_OIDC_CLIENT_ID=best-badges
      - API_URL=http://api:3001
      - TZ=Europe/Berlin
    depends_on:
      api: { condition: service_healthy }
    labels:
      - traefik.enable=true
      - traefik.docker.network=rag-stack_rag
      - traefik.http.routers.badges-manage.rule=Host(`badges.stuffdev.de`)
      - traefik.http.routers.badges-manage.entrypoints=websecure
      - traefik.http.routers.badges-manage.tls=true
      - traefik.http.routers.badges-manage.tls.certresolver=le
      - traefik.http.routers.badges-manage.middlewares=secure-headers@file,badges-ratelimit,badges-noindex,service-errors@file
      - traefik.http.services.badges-manage.loadbalancer.server.port=5174

  mock-hsp:
    # Ersatz für das HSP-Organisationsportal, nur intern erreichbar. Testkonten: ./hsp.json
    # (Schlüssel = Authentik-Benutzername, weil der Anbieter den Benutzernamen als sub liefert)
    <<: *common
    image: best-badges-mock-hsp:${BADGES_TAG:-latest}
    mem_limit: 96m
    container_name: best-badges-mock-hsp
    networks: [internal]
    volumes:
      - ./hsp.json:/app/data/hsp.json:ro

networks:
  rag:
    external: true
    name: rag-stack_rag
  internal:
    internal: true
