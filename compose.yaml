# Lokaler Entwicklungs-Stack. Alle Ports nur auf 127.0.0.1.
name: best-badges

services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: badges
      POSTGRES_USER: badges
      POSTGRES_PASSWORD: badges-dev
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U badges -d badges"]
      interval: 5s
      timeout: 3s
      retries: 10

  mock-oidc:
    # Ersatz für die Goslar ID: echter OIDC-Anbieter mit Login-Seite
    image: ghcr.io/navikt/mock-oauth2-server:2.2.1
    environment:
      SERVER_PORT: "8080"
      JSON_CONFIG_PATH: /config/config.json
    volumes:
      - ./dev/mock-oidc/config.json:/config/config.json:ro
    ports:
      - "127.0.0.1:8080:8080"
    # Kein Healthcheck: das Image ist distroless (ohne Shell, wget oder curl).

  mock-hsp:
    # Ersatz für das HSP-Organisationsportal
    build: ./dev/mock-hsp
    ports:
      - "127.0.0.1:4010:4010"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4010/health >/dev/null || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
